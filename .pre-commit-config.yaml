# Keep the ruff, isort and mypy revs in step with the versions in uv.lock, so
# the hooks and CI agree on what is an error.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
        # Python files only, as in CI: ruff 0.17 would also reformat the code
        # examples in README.md and docs/.
        types_or: [python, pyi]

  - repo: https://github.com/PyCQA/isort
    rev: 9.0.1
    hooks:
      - id: isort

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.1
    hooks:
      - id: mypy
        args: [--ignore-missing-imports]
        additional_dependencies:
          - pydantic>=2.10.6
          - pydantic-settings>=2.7.1
          - httpx>=0.28.1

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # mkdocs.yml uses a !!python/name tag for the mermaid fence.
        args: [--unsafe]
      - id: check-toml
      - id: debug-statements
