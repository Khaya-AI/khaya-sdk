name: Release to PyPI

# Two ways in:
#   * push a `vX.Y.Z` tag  — validates the tag against pyproject.toml, tests,
#     publishes to PyPI, then cuts a GitHub release.
#   * workflow_dispatch    — pick a target; `testpypi` rehearses a release
#     without burning a version number on PyPI.
#
# Authentication is OIDC via PyPI Trusted Publishers, so no API token secret
# exists to leak. This requires a one-time publisher registration on pypi.org
# naming this repository, `release.yml`, and the `pypi` environment below.
# TestPyPI needs the same registration against `testpypi`, but only if you
# intend to use the rehearsal path — the tag path never touches it.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+.post[0-9]+"
  workflow_dispatch:
    inputs:
      target:
        description: "Publish target"
        required: true
        default: "testpypi"
        type: choice
        options:
          - testpypi
          - pypi

permissions:
  contents: read

jobs:
  validate:
    name: Validate version tag
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Get version from pyproject.toml
        id: get_version
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -1)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read a version from pyproject.toml"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="${{ steps.get_version.outputs.version }}"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' does not match pyproject.toml version '${PKG}'"
            exit 1
          fi

  test:
    name: Test (Python ${{ matrix.python-version }})
    needs: [validate]
    # `validate` is skipped on workflow_dispatch (no tag to check), and a
    # skipped dependency would otherwise skip this job too.
    if: |
      always() && (
        needs.validate.result == 'success' ||
        needs.validate.result == 'skipped'
      )
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra test --extra dev

      - name: Lint
        run: uv run ruff check src/khaya

      - name: Type check
        run: uv run mypy src/khaya

      - name: Unit tests
        run: uv run pytest -m "not integration"

  build:
    name: Build distribution
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Build sdist and wheel
        run: uv build

      - name: Check distribution metadata
        run: uvx twine check dist/*

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # Rehearsal only, never on the tag path: a TestPyPI outage or a lost login
  # should not be able to block a real release.
  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/khaya/
    permissions:
      id-token: write
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # A rehearsal upload of this version may already be there; that is
          # not a reason to block the production publish.
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/khaya/
    permissions:
      id-token: write
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release
    needs: [validate, publish-pypi]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Extract CHANGELOG section
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          awk -v ver="## [${VERSION}]" '
            index($0, ver) == 1 { found = 1; next }
            found && /^## \[/     { exit }
            found                 { print }
          ' CHANGELOG.md | sed '/^---$/d' > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "See CHANGELOG.md for details." > release_notes.md
          fi

      # Cut the release with the gh CLI rather than a marketplace action: this
      # job holds contents: write, and that is not a permission to hand to an
      # unpinned third-party action for what is a single API call.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "khaya ${GITHUB_REF_NAME}" \
            --notes-file release_notes.md \
            dist/*
