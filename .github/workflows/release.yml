name: Release to PyPI

# Push a `vX.Y.Z` tag to release: validate, test, TestPyPI, PyPI, GitHub
# release. Or dispatch manually with `testpypi` to rehearse.
#
# Auth is OIDC via PyPI Trusted Publishers — no token secret to leak. Needs a
# one-time publisher registration on pypi.org and test.pypi.org naming this
# repo, this file, and the `pypi` / `testpypi` environments below.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+.post[0-9]+"
  workflow_dispatch:
    inputs:
      target:
        description: "Publish target"
        required: true
        default: "testpypi"
        type: choice
        options:
          - testpypi
          - pypi

permissions:
  contents: read

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get version from pyproject.toml
        id: get_version
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -1)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read a version from pyproject.toml"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # A dispatch can target any ref, so PyPI publishes require a matching
      # tag on the checked-out commit. TestPyPI is a rehearsal and does not.
      - name: Verify the version is tagged
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
          TARGET: ${{ inputs.target }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
              echo "::error::Tag '${GITHUB_REF_NAME}' does not match pyproject.toml version '${VERSION}'"
              exit 1
            fi
          elif [ "$TARGET" = "pypi" ]; then
            if ! git tag --points-at HEAD | grep -qx "v${VERSION}"; then
              echo "::error::HEAD is not tagged v${VERSION}; tag the commit or publish to testpypi instead"
              exit 1
            fi
          fi
          echo "Publishing version ${VERSION}"

  test:
    name: Test (Python ${{ matrix.python-version }})
    needs: [validate]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra test --extra dev

      - name: Lint
        run: uv run ruff check src/khaya

      - name: Type check
        run: uv run mypy src/khaya

      - name: Unit tests
        run: uv run pytest -m "not integration"

  build:
    name: Build distribution
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Build sdist and wheel
        run: uv build

      - name: Check distribution metadata
        run: uvx twine check dist/*

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi')
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/khaya/
    permissions:
      id-token: write
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # A rehearsal upload must not block the production publish.
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    needs: [build, publish-testpypi]
    # `publish-testpypi` is skipped on dispatch with target=pypi.
    if: |
      always() &&
      needs.build.result == 'success' &&
      (needs.publish-testpypi.result == 'success' ||
       needs.publish-testpypi.result == 'skipped') &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi'))
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/khaya/
    permissions:
      id-token: write
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release
    needs: [validate, publish-pypi]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Extract CHANGELOG section
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          awk -v ver="## [${VERSION}]" '
            index($0, ver) == 1 { found = 1; next }
            found && /^## \[/     { exit }
            found                 { print }
          ' CHANGELOG.md | sed '/^---$/d' > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "See CHANGELOG.md for details." > release_notes.md
          fi

      # gh CLI, not a marketplace action: this job holds contents: write.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "khaya ${GITHUB_REF_NAME}" \
            --notes-file release_notes.md \
            dist/*
