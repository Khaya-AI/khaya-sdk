name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: nothing here needs write access.
permissions:
  contents: read

# Supersede in-flight runs for the same ref rather than queueing them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        # --frozen: fail if uv.lock is out of date rather than silently
        # resolving different versions than the lockfile pins.
        run: uv sync --frozen --extra test --extra dev

      - name: Lint with ruff
        run: uv run ruff check src/khaya tests

      # NOTE: `ruff format --check` is deliberately not enabled yet — nine
      # files on main are currently unformatted, so the gate would fail on
      # arrival. See the PR description for the follow-up.

      - name: Type-check with mypy
        run: uv run mypy src/khaya tests

      - name: Run unit tests (no integration)
        run: uv run pytest -m "not integration"

  build:
    name: Build and verify distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Build sdist and wheel
        run: uv build --out-dir dist

      - name: Validate distribution metadata
        run: uv run --with twine twine check dist/*

      - name: Install the wheel into a clean environment and import it
        # Catches packaging regressions (missing modules, bad metadata) at PR
        # time instead of on release day.
        run: |
          uv run --isolated --no-project --with dist/*.whl python - <<'PY'
          import khaya
          from khaya import APIError, KhayaClient  # noqa: F401

          print(f"imported khaya {khaya.__version__} with {len(khaya.__all__)} exports")
          PY

      - name: Confirm py.typed ships in the wheel
        # PEP 561: without this marker downstream users get no type information.
        run: |
          python -m zipfile -l dist/*.whl | grep -q 'khaya/py.typed' \
            || { echo "::error::py.typed missing from wheel"; exit 1; }

  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Build docs in strict mode
        # --strict turns broken links and bad nav entries into failures, so
        # docs breakage surfaces on the PR rather than on Read the Docs.
        run: uv run --with-requirements docs/requirements.txt mkdocs build --strict
